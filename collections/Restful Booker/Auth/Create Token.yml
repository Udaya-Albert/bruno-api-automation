info:
  name: Create Token
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "username" : "admin",
          "password" : "password123"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();
        bru.setVar("token", data.token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
